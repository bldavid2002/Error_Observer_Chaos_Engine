server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: python-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: python
          service: generator
          __path__: /var/log/app/generator.log*
      - targets:
          - localhost
        labels:
          job: python
          service: worker
          __path__: /var/log/app/worker.log*
